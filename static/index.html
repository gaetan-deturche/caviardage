<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caviardage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* A censor's dossier: cool file-folder paper, inked bars, typed headings. */
:root {
  --desk: #c9d2d6; --paper: #f1f4f3; --ink: #1d2a33; --muted: #566670; --line: #b7c3c8;
  --bar: #141c22; --bar-text: #f1f4f3;
  --same: #1f7a4d; --same-bg: #d5ecdf;
  --focus: #b4540f; --lit: #d98a00;
  --missed-bg: #d6dee3; --missed-text: #4a5a64; --stamp: #a32638;
  --type: "Special Elite", "Courier New", monospace;
  --body: "Source Serif 4", Georgia, serif;
  --ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --desk: #11181d; --paper: #1b252c; --ink: #e2e9ea; --muted: #9aaab2; --line: #33434d;
    --bar: #070b0e; --bar-text: #f1f4f3;
    --same: #63c994; --same-bg: #173c2a;
    --focus: #f0a062; --lit: #f2b84b;
    --missed-bg: #33424c; --missed-text: #c2ccd2; --stamp: #e86a7d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font: 400 18px/1.75 var(--body); padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: 600 16px/1.2 var(--ui); color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
/* With a mouse the page scrolls as usual: the title comes first and the field stays pinned. */
.scroller { display: contents; }
.entrybar { order: 1; }
.top { order: 0; }
.layout { order: 2; }

/* On a touch screen the page never scrolls, because a phone keyboard slides a scrolling page
   out of place. The field is a fixed row, and the rest scrolls underneath, above the keyboard. */
@media (pointer: coarse) {
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { padding: 0; }
  .wrap { display: flex; flex-direction: column; gap: 0; height: var(--visible-height, 100dvh); max-width: none; }
  .entrybar { order: 0; position: static; flex: none; border-width: 0 0 1px; border-radius: 0; padding-top: max(6px, env(safe-area-inset-top, 0px)); }
  .scroller { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; order: 1; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px max(12px, env(safe-area-inset-left, 0px)) 32px max(12px, env(safe-area-inset-right, 0px)); }
  .side { position: static; max-height: none; overflow: visible; }
}
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font: 400 30px/1 var(--type); margin: 0; letter-spacing: .01em; }
.brand s { text-decoration: none; background: var(--ink); color: transparent; border-radius: 2px; padding: 0 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
select, .btn { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 840px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static !important; max-height: none !important; } }

.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 24px clamp(16px, 4vw, 44px) 36px; min-width: 0; }
/* Always on screen: the field and the result of the last guess. */
.entrybar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 3px 3px; padding: 6px clamp(10px, 3vw, 20px) 6px; box-shadow: 0 2px 6px rgb(0 0 0 / 0.18); }
.entry { display: flex; gap: 8px; }
#word { flex: 1; min-width: 0; font: 400 20px/1.2 var(--type); background: transparent; border: 0; border-bottom: 2px solid var(--ink); padding: 6px 4px; }
.msg { min-height: 20px; margin: 3px 0 0; font: 500 14px/1.4 var(--ui); color: var(--muted); }
.msg.bad { color: var(--stamp); }
.msgrow { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: flex-start; }
.msgrow .msg { flex: 1; min-width: 0; }
.jump { flex: none; margin-top: 2px; padding: 2px 10px; font-size: 14px; background: var(--paper); border: 1px solid var(--lit); border-radius: 4px; cursor: pointer; }
/* Bars the last guess lit or brought closer. */
.slot.lit, .dot.lit { box-shadow: 0 0 0 2px var(--lit); }
.dot.lit { background: var(--bar); }
.slot.pulse { animation: pulse 1s ease-out 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--lit); } }

#title { font: 400 clamp(25px, 4vw, 36px)/1.45 var(--type); margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); text-wrap: balance; }
#text p { margin: 0 0 16px; max-width: 72ch; overflow-wrap: anywhere; }

.slot { display: inline-block; font: inherit; line-height: 1.2; vertical-align: baseline; border-radius: 2px; background: var(--bar); color: var(--bar-text); padding: 0 3px; margin: 0 1px; cursor: pointer; border: 0; text-align: center; }
/* Bars stay black. The closer a guess, the whiter its text. */
.slot.family, .slot.scene { color: color-mix(in srgb, #fff calc(var(--shade) * 100%), #5c6a73); font-style: italic; }
.ramp { margin-top: 8px; padding: 3px 6px; border-radius: 2px; background: var(--bar); font: italic 400 15px/1.2 var(--body); display: flex; justify-content: space-between; }
.ramp span { flex: 1; text-align: center; }
.easy { display: flex; gap: 6px; align-items: center; margin-top: 10px; cursor: pointer; }
.ramp-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 2px; }
.slot.count { font: 600 .8em/1.55 var(--ui); }
.shown.fresh { background: var(--same-bg); color: var(--same); font-weight: 600; border-radius: 2px; box-shadow: 0 0 0 1px var(--same-bg); }
.gaveup .shown { color: var(--ink); }
#text sup, #text sub, #title sup, #title sub { line-height: 0; }
.shown.missed, .shown.given { background: var(--missed-bg); color: var(--missed-text); border-radius: 2px; box-shadow: 0 0 0 1px var(--missed-bg); }
/* A selected bar, for hints, and the letters hints showed. */
.slot.selected { outline: 2px dashed var(--focus); outline-offset: 2px; }
.slot.hinted { background: transparent; padding: 0; }
.slot.hinted .letters { color: var(--ink); font-style: normal; }
.slot.hinted .rest { display: inline-block; background: var(--bar); border-radius: 2px; padding: 0 3px; }
.dot.given { background: var(--missed-bg); }
.used { color: var(--muted); font-size: 14px; }
.used:empty { display: none; }

.side { position: sticky; top: 100px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-height: calc(100vh - 116px); overflow: auto; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; font-family: var(--ui); font-size: 15px; line-height: 1.4; }
.card h2 { margin: 0 0 8px; font: 600 13px/1.2 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.code { font: 400 26px/1.2 var(--type); letter-spacing: .04em; overflow-wrap: anywhere; }
.hint { margin: 6px 0 10px; color: var(--muted); }
.team .btn { width: 100%; }
.join { display: flex; gap: 6px; margin-top: 8px; }
.join input { flex: 1; min-width: 0; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 8px; font-family: var(--type); }
.join .btn { width: auto; }
#history { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; display: grid; gap: 2px; }
#history button { width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; cursor: pointer; font: 500 15px/1.3 var(--ui); color: inherit; }
#history button:hover { background: var(--line); }
#history .current { font-weight: 600; }
#history .meta { display: block; color: var(--muted); font-size: 13px; font-weight: 500; }
.player { font-family: var(--type); font-weight: 400; letter-spacing: .03em; }
.history .hint:empty { display: none; }
.big { font: 400 40px/1 var(--type); font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.legend li, #log li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 2px; background: var(--line); }
.dot.same { background: var(--same); }
#log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
#log .w { overflow-wrap: anywhere; font-weight: 500; }
#log .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.result { border: 2px solid var(--same); border-radius: 3px; padding: 16px 18px; margin-bottom: 20px; font-family: var(--ui); line-height: 1.45; }
.result.lost { border-color: var(--stamp); }
.result strong { display: block; font: 400 25px/1.25 var(--type); margin-bottom: 4px; }
.result a { color: inherit; }
.credit { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.loading { color: var(--muted); font-family: var(--ui); }
@media (prefers-reduced-motion: no-preference) { .shown.fresh { transition: background .6s; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="entrybar">
    <form id="entry" class="entry" autocomplete="off">
      <input id="word" autocapitalize="off" spellcheck="false" aria-label="Mot">
      <button class="btn primary" id="send" type="submit"></button>
    </form>
    <div class="msgrow"><p id="msg" class="msg" role="status"></p><button id="jump" class="jump" type="button" hidden></button><button id="hintBtn" class="jump" type="button" hidden></button></div>
  </div>
  <div class="scroller">
  <header class="top">
    <h1 class="brand">Cavi<s>ar</s>dage</h1>
    <div class="controls">
      <label for="lang" hidden>Langue</label>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option></select>
      <label for="level" hidden>Pages</label>
      <select id="level"></select>
      <button id="giveup" class="btn" type="button"></button>
      <button id="next" class="btn primary" type="button"></button>
    </div>
  </header>
  <div class="layout">
    <main class="sheet">
      <div id="result" hidden></div>
      <h2 id="title"></h2>
      <div id="text"><p class="loading" id="loading"></p></div>
    </main>
    <aside class="side">
      <section class="card"><h2 id="countLabel"></h2><div class="big" id="count">0</div><div class="used" id="hintsUsed"></div></section>
      <section class="card team">
        <h2 id="teamLabel"></h2>
        <div class="code" id="code"></div>
        <p class="hint" id="teamHint"></p>
        <button id="share" class="btn" type="button"></button>
        <form id="join" class="join" autocomplete="off">
          <input id="joinCode" maxlength="14" autocapitalize="characters" spellcheck="false">
          <button class="btn" id="joinSend" type="submit"></button>
        </form>
      </section>
      <section class="card history">
        <h2 id="historyLabel"></h2>
        <ul id="history"></ul>
        <p class="hint" id="historyEmpty"></p>
        <p class="hint"><span id="playerLabel"></span> <strong class="player" id="playerCode"></strong><br><span id="playerHint"></span></p>
        <form id="playerForm" class="join" autocomplete="off">
          <input id="playerInput" maxlength="9" autocapitalize="characters" spellcheck="false">
          <button class="btn" id="playerSend" type="submit"></button>
        </form>
      </section>
      <section class="card"><h2 id="legendLabel"></h2><ul class="legend" id="legend"></ul>
        <div class="ramp"><span style="color: #6d7a82" id="rampFar"></span><span style="color: #a3acb2">&middot;</span><span style="color: #fff" id="rampClose"></span></div>
        <label class="easy"><input type="checkbox" id="easy"> <span id="easyLabel"></span></label>
        <p class="hint" id="hintHelp"></p></section>
      <section class="card"><h2 id="logLabel"></h2><ul id="log"></ul></section>
    </aside>
  </div>
  </div>
</div>
<script>
const COPY = {
  fr: {
    easy: "Mode facile : voir le % en cliquant sur une barre", far: "essai loin", close: "essai proche", percent: n => `${n} %`, closeLabel: (n, word) => `« ${word} » est proche à ${n} %`, guessView: "Revoir la page cachée avec mes essais", missedSample: "Surlignés", missedNote: ": les mots que vous n'aviez pas trouvés.", historyTitle: "Historique", historyEmpty: "Vos pages apparaîtront ici.", ongoing: "Page en cours", solved: "trouvée", gaveUp: "abandon", guesses: n => `${n} essai${n > 1 ? "s" : ""}`, playerLabel: "Votre code :", playerHint: "Entrez-le sur un autre appareil pour y retrouver votre historique.", playerPlaceholder: "Code d'un appareil", playerUse: "Utiliser", playerBad: "Ce code n'est pas valide : il faut 8 caractères, comme 7F3A-91C2.", playerDone: "Historique chargé. Cet appareil utilise maintenant ce code.", team: "À plusieurs", teamHint: "Partagez ce code : vos amis jouent la même page, et chaque mot trouvé apparaît chez tout le monde.", joinHint: "Code d'un ami", joinSend: "Rejoindre", noCode: "Ce code ne correspond à aucune partie. Vérifiez-le auprès de votre ami.", others: n => `${n} nouvel${n > 1 ? "s" : ""} essai${n > 1 ? "s" : ""} d'un autre joueur.`, share: "Copier le lien", copied: "Lien copié. Ouvrez-le n'importe où pour reprendre cette partie.", gone: "Cette partie est introuvable. Voici une nouvelle page.", famous: "Pages très connues", wide: "Pages connues", deep: "100 000 pages (difficile)", next: "Nouvelle page", giveup: "Abandonner", sure: "Confirmer l'abandon",
    send: "Essayer", placeholder: "Un mot, sous n'importe quelle forme", count: "Essais", legend: "Couleurs", log: "Vos essais",
    same: "Mot trouvé, quelle que soit la forme", none: "Rien de proche", lit: "Encadré : touché ou amélioré par le dernier essai", jump: (a, n) => `Voir ${a}/${n}`,
    slow: "Le serveur met du temps à répondre…", checking: w => `Essai de « ${w} »…`, loading: "Choix d'une page…", opening: "Ouverture de la partie…", noPage: "Wikipédia n'a pas renvoyé de page. Attendez un instant, puis cliquez sur Nouvelle page.", dup: w => `Déjà essayé : ${w}.`, unknown: w => `« ${w} » n'est pas un mot connu. Cet essai ne compte pas.`,
    invalid: "Entrez un seul mot.", nothing: w => `Rien de proche pour « ${w} ».`, expired: "Cette partie a expiré. Lancez une nouvelle page.", net: "Le serveur ne répond pas. Vérifiez qu'il tourne toujours.",
    hit: (w, n) => `${w} : ${n} mot${n > 1 ? "s" : ""} révélé${n > 1 ? "s" : ""}.`,
    near: (w, n, up) => `${w} : proche de ${n} mot${n > 1 ? "s" : ""} (${up ? `${up} amélioré${up > 1 ? "s" : ""}` : "aucun amélioré"}).`,
    won: (n, h) => `Trouvé en ${n} essai${n > 1 ? "s" : ""}${h ? ` et ${h} indice${h > 1 ? "s" : ""}` : ""} !`, lost: (n, h) => `Abandon après ${n} essai${n > 1 ? "s" : ""}${h ? ` et ${h} indice${h > 1 ? "s" : ""}` : ""}.`,
    hintNext: n => n === 1 ? "Indice : 1re lettre" : `Indice : ${n}e lettre`, hintLast: "Indice : dernière lettre", hintSure: "Confirmer : révéler le mot (abandon du mot)",
    hintGiven: "Mot révélé par les indices : il compte comme abandonné.", hintShown: n => `Indice : ${n} lettre${n > 1 ? "s" : ""} montrée${n > 1 ? "s" : ""}.`,
    hintsUsed: n => `${n} indice${n > 1 ? "s" : ""}`, given: "Mot révélé par indice, pas trouvé", hintHelp: "Indice : touchez une barre, puis le bouton Indice en haut pour voir sa lettre suivante. La dernière lettre révèle le mot, compté comme abandonné ; si c'est un mot du titre, la page comptera comme abandonnée.", read: "Lire la page sur Wikipédia", credit: "Texte : Wikipédia, licence CC BY-SA.",
    letters: n => `${n}`, wordLabel: "Mot",
  },
  en: {
    easy: "Easy mode: see the % when clicking a bar", far: "guess far", close: "guess close", percent: n => `${n}%`, closeLabel: (n, word) => `"${word}" is ${n}% close`, guessView: "Show the hidden page with my guesses", missedSample: "Highlighted", missedNote: "words are the ones you hadn't found.", historyTitle: "History", historyEmpty: "Your pages will appear here.", ongoing: "Page in progress", solved: "solved", gaveUp: "gave up", guesses: n => `${n} guess${n > 1 ? "es" : ""}`, playerLabel: "Your code:", playerHint: "Enter it on another device to see your history there.", playerPlaceholder: "A device's code", playerUse: "Use", playerBad: "That code isn't valid: it needs 8 characters, like 7F3A-91C2.", playerDone: "History loaded. This device now uses this code.", team: "Play together", teamHint: "Share this code: your friends play the same page, and every word found shows up for everyone.", joinHint: "A friend's code", joinSend: "Join", noCode: "That code doesn't match any game. Check it with your friend.", others: n => `${n} new guess${n > 1 ? "es" : ""} from another player.`, share: "Copy link", copied: "Link copied. Open it anywhere to continue this game.", gone: "This game wasn't found. Here's a new page.", famous: "Very famous pages", wide: "Well-known pages", deep: "100,000 pages (hard)", next: "New page", giveup: "Give up", sure: "Confirm giving up",
    send: "Try", placeholder: "One word, in any form", count: "Guesses", legend: "Colours", log: "Your guesses",
    same: "Word found, in any form", none: "Nothing close", lit: "Outlined: lit or improved by the last guess", jump: (a, n) => `Show ${a}/${n}`,
    slow: "The server is taking a while…", checking: w => `Trying "${w}"…`, loading: "Picking a page…", opening: "Opening the game…", noPage: "Wikipedia didn't return a page. Wait a moment, then click New page.", dup: w => `Already tried: ${w}.`, unknown: w => `"${w}" isn't a known word. This guess doesn't count.`,
    invalid: "Enter a single word.", nothing: w => `Nothing close to "${w}".`, expired: "This game expired. Start a new page.", net: "The server isn't responding. Check that it's still running.",
    hit: (w, n) => `${w}: ${n} word${n > 1 ? "s" : ""} revealed.`,
    near: (w, n, up) => `${w}: close to ${n} word${n > 1 ? "s" : ""} (${up || "none"} improved).`,
    won: (n, h) => `Solved in ${n} guess${n > 1 ? "es" : ""}${h ? ` and ${h} hint${h > 1 ? "s" : ""}` : ""}!`, lost: (n, h) => `Gave up after ${n} guess${n > 1 ? "es" : ""}${h ? ` and ${h} hint${h > 1 ? "s" : ""}` : ""}.`,
    hintNext: n => `Hint: letter ${n}`, hintLast: "Hint: last letter", hintSure: "Confirm: reveal the word (gives it up)",
    hintGiven: "Word revealed by hints: it counts as given up.", hintShown: n => `Hint: ${n} letter${n > 1 ? "s" : ""} shown.`,
    hintsUsed: n => `${n} hint${n > 1 ? "s" : ""}`, given: "Word revealed by a hint, not found", hintHelp: "Hints: tap a bar, then the Hint button at the top to see its next letter. The last letter reveals the word as given up; for a title word, the page counts as given up.", read: "Read the page on Wikipedia", credit: "Text: Wikipedia, CC BY-SA licence.",
    letters: n => `${n}`, wordLabel: "Word",
  },
};

const $ = id => document.getElementById(id);
const store = {
  get(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* Settings just won't be remembered. */ } },
};

let game = null, lang = store.get("cav-lang", "fr"), level = store.get("cav-level", "famous");
let easy = store.get("cav-easy", "") === "1";
let showGuessView = false;
let player = store.get("cav-player", "");
if (!/^[0-9a-f]{8}$/.test(player)) {
  player = [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2, "0")).join("");
  store.set("cav-player", player);
}
let queue = [], busy = false, confirming = false, countsShown = new Set(), known = new Set();
const t = () => COPY[lang];

function paintCopy() {
  const c = t();
  document.documentElement.lang = lang;
  $("lang").value = lang;
  $("level").replaceChildren(...["famous", "wide", "deep"].map(v => new Option(c[v], v)));
  $("level").value = level;
  $("next").textContent = c.next;
  $("share").textContent = c.share;
  $("historyLabel").textContent = c.historyTitle;
  $("playerLabel").textContent = c.playerLabel;
  $("playerCode").textContent = formatCode(player);
  $("playerHint").textContent = c.playerHint;
  $("playerInput").placeholder = c.playerPlaceholder;
  $("playerSend").textContent = c.playerUse;
  $("teamLabel").textContent = c.team;
  $("teamHint").textContent = c.teamHint;
  $("joinCode").placeholder = c.joinHint;
  $("joinSend").textContent = c.joinSend;
  $("giveup").textContent = confirming ? c.sure : c.giveup;
  $("send").textContent = c.send;
  $("word").placeholder = c.placeholder;
  $("word").setAttribute("aria-label", c.wordLabel);
  $("countLabel").textContent = c.count;
  $("legendLabel").textContent = c.legend;
  $("easyLabel").textContent = c.easy;
  $("easy").checked = easy;
  $("rampFar").textContent = c.far;
  $("rampClose").textContent = c.close;
  $("logLabel").textContent = c.log;
  $("legend").replaceChildren(...["same", "lit", "given", "none"].map(k => row(k, c[k])));
  $("hintHelp").textContent = c.hintHelp;
  paintHint();
}

function row(tier, label, extra, shade) {
  const li = document.createElement("li");
  const dot = document.createElement("span");
  dot.className = `dot ${tier}`;
  if (shade) dot.style.background = `color-mix(in srgb, #fff ${shade * 100}%, #5c6a73)`;
  const name = document.createElement("span");
  name.className = "w";
  name.textContent = label;
  li.append(dot, name);
  if (extra !== undefined) {
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = extra;
    li.append(n);
  }
  return li;
}

function say(text, bad) {
  $("msg").textContent = text || "";
  $("msg").classList.toggle("bad", !!bad);
}

const SLOW_NOTICE_MS = 400, SLOW_REPORT_MS = 1500;

// Says something when a request takes a while, and tells the server how long it took here.
async function post(path, body, waiting) {
  const start = performance.now();
  const notice = waiting ? setTimeout(() => say(waiting), SLOW_NOTICE_MS) : null;
  const later = setTimeout(() => say(t().slow), 3000);
  try {
    const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const answer = await response.json();
    const waited = Math.round(performance.now() - start);
    if (waited > SLOW_REPORT_MS) {
      const report = JSON.stringify({ what: path, waited, server: Number(response.headers.get("X-Took")) || null });
      try { navigator.sendBeacon("api/slow", new Blob([report], { type: "application/json" })); } catch { /* Only a report. */ }
    }
    return answer;
  } finally {
    clearTimeout(notice);
    clearTimeout(later);
  }
}

const COUNT_SECONDS = 3;
const countTimers = new Map();

// On a touch screen, focusing the field opens the keyboard over what you just tapped.
function focusField() {
  if (matchMedia("(pointer: fine)").matches) $("word").focus({ preventScroll: true });
}

// The usable height shrinks when a phone keyboard opens. Also undo any slide the browser adds.
function fitToScreen() {
  const view = window.visualViewport;
  if (!view) return;
  document.documentElement.style.setProperty("--visible-height", `${view.height}px`);
  if (matchMedia("(pointer: coarse)").matches && (window.scrollY || view.offsetTop)) window.scrollTo(0, 0);
}

function makeSlot(token) {
  const slot = document.createElement("button");
  slot.type = "button";
  slot.className = "slot" + (token.tier ? ` ${token.tier}` : "");
  slot.style.minWidth = `${Math.max(token.length, 1) * 0.6}em`;
  const shown = countsShown.has(token.i);
  const percent = token.near && easy ? Math.round(token.shade * 100) : null;
  if (token.near) {
    slot.style.setProperty("--shade", token.shade);
    if (percent !== null) slot.title = t().closeLabel(percent, token.near);
  }
  const lit = marked.has(token.i);
  slot.dataset.i = token.i;
  if (lit) slot.classList.add("lit");
  if (shown) slot.classList.add("count");
  if (token.i === selected) slot.classList.add("selected");
  const label = shown
    ? (percent !== null ? `${t().letters(token.length)} · ${t().percent(percent)}` : t().letters(token.length))
    : lit && percent !== null ? `${token.near} · ${t().percent(percent)}`
    : (token.near || " ");
  if (token.hint) {
    // Letters from hints show as plain text, and the bar only covers the rest, like the logo.
    slot.classList.add("hinted");
    slot.style.minWidth = "";
    const letters = document.createElement("span");
    letters.className = "letters";
    letters.textContent = token.hint;
    const rest = document.createElement("span");
    rest.className = "rest";
    rest.style.minWidth = `${Math.max(token.length - token.hint.length, 1) * 0.6}em`;
    rest.textContent = label;
    slot.append(letters, rest);
  } else {
    slot.textContent = label;
  }
  slot.addEventListener("click", () => {
    selected = selected === token.i ? null : token.i;
    hintConfirm = false;
    clearTimeout(countTimers.get(token.i));
    if (countsShown.has(token.i)) {
      countsShown.delete(token.i);
    } else {
      countsShown.add(token.i);
      countTimers.set(token.i, setTimeout(() => {
        if (countsShown.delete(token.i)) render();
      }, COUNT_SECONDS * 1000));
    }
    render();
    focusField();
  });
  return slot;
}

function appendTo(parent, token) {
  const target = token.script ? parent.appendChild(document.createElement(token.script)) : parent;
  if (!token.word) { target.append(token.text); return; }
  if (token.revealed) {
    const span = document.createElement("span");
    span.className = "shown" + (token.fresh ? " fresh" : "") + (token.missed ? " missed" : "") + (token.given ? " given" : "");
    span.textContent = token.text;
    target.append(span);
    return;
  }
  parent.append(makeSlot(token));
}

function render() {
  if (!game) return;
  const c = t();
  const titleEl = $("title"), textEl = $("text");
  titleEl.replaceChildren();
  textEl.replaceChildren();
  textEl.classList.toggle("gaveup", game.gaveUp);
  let paragraph = document.createElement("p");
  const tokens = game.finished && showGuessView ? game.guessView : game.tokens;
  for (const token of tokens) {
    if (token.part === "break") {
      if (paragraph.childNodes.length) textEl.append(paragraph);
      paragraph = document.createElement("p");
    } else if (token.part === "title") {
      appendTo(titleEl, token);
    } else {
      appendTo(paragraph, token);
    }
  }
  if (paragraph.childNodes.length) textEl.append(paragraph);

  $("count").textContent = game.count;
  $("hintsUsed").textContent = game.hints ? c.hintsUsed(game.hints) : "";
  paintHint();
  $("code").textContent = formatCode(game.id);
  $("log").replaceChildren(...[...game.log].reverse().map(g => row(g.hits ? "same" : "none", g.word, g.hits || "", g.hits ? 0 : g.shade)));
  $("word").disabled = $("send").disabled = $("giveup").disabled = game.finished;

  const result = $("result");
  result.hidden = !game.finished;
  if (game.finished) {
    result.className = "result" + (game.gaveUp ? " lost" : "");
    const head = document.createElement("strong");
    head.textContent = game.gaveUp ? c.lost(game.count, game.hints) : c.won(game.count, game.hints);
    const name = document.createElement("div");
    name.textContent = game.answer.title;
    const link = document.createElement("a");
    link.href = game.answer.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = c.read;
    const legend = document.createElement("p");
    legend.className = "credit";
    const sample = document.createElement("span");
    sample.className = "shown missed";
    sample.textContent = c.missedSample;
    legend.append(sample, ` ${c.missedNote}`);
    const credit = document.createElement("p");
    credit.className = "credit";
    credit.textContent = c.credit;
    const view = document.createElement("label");
    view.className = "easy";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = "guessView";
    box.checked = showGuessView;
    box.addEventListener("change", () => {
      showGuessView = box.checked;
      render();
    });
    const viewText = document.createElement("span");
    viewText.textContent = c.guessView;
    view.append(box, viewText);
    legend.hidden = showGuessView;
    result.replaceChildren(head, name, link, view, legend, credit);
  }
}

// Bars a new guess lit for the first time or brought closer, closest first.
let marked = new Map(), jumpAt = 0;

function markCloser(before, after) {
  const old = new Map();
  if (before && before.id === after.id) for (const token of before.tokens) if (token.near) old.set(token.i, token.shade);
  marked = new Map();
  jumpAt = 0;
  if (!after.finished) {
    for (const token of after.tokens) {
      if (token.near && !token.revealed && (!old.has(token.i) || token.shade > old.get(token.i) + 1e-9)) marked.set(token.i, token.shade);
    }
    marked = new Map([...marked].sort((a, b) => b[1] - a[1]));
  }
  paintJump();
}

function paintJump() {
  $("jump").hidden = !marked.size;
  if (marked.size) $("jump").textContent = t().jump(jumpAt % marked.size + 1, marked.size);
}

$("jump").addEventListener("click", () => {
  const ids = [...marked.keys()];
  if (!ids.length) return;
  const slot = document.querySelector(`.slot[data-i="${ids[jumpAt % ids.length]}"]`);
  jumpAt += 1;
  paintJump();
  if (!slot) return;
  slot.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  slot.classList.remove("pulse");
  void slot.offsetWidth;
  slot.classList.add("pulse");
  focusField();
});

// The bar the player tapped last, which the Hint button works on.
let selected = null, hintConfirm = false;

function paintHint() {
  const button = $("hintBtn");
  const token = game && !game.finished && selected !== null
    ? game.tokens.find(tk => tk.i === selected && tk.word && !tk.revealed) : null;
  if (!token) { selected = null; hintConfirm = false; button.hidden = true; return; }
  const c = t();
  const next = (token.hint || "").length + 1;
  button.hidden = false;
  button.textContent = next >= token.length ? (hintConfirm ? c.hintSure : c.hintLast) : c.hintNext(next);
}

$("hintBtn").addEventListener("click", async () => {
  if (!game || selected === null || busy) return;
  const token = game.tokens.find(tk => tk.i === selected);
  if (!token) return;
  if ((token.hint || "").length + 1 >= token.length && !hintConfirm) {
    hintConfirm = true;
    paintHint();
    return;
  }
  hintConfirm = false;
  const id = game.id;
  busy = true;
  try {
    const answer = await post("api/hint", { id, i: selected, player });
    if (!game || game.id !== id) return;
    if (answer.error === "expired") say(t().expired, true);
    else if (!answer.error) {
      markCloser(game, answer.state);
      game = answer.state;
      markFresh(game);
      say(answer.given ? t().hintGiven : t().hintShown(answer.letters));
      render();
      if (game.finished) loadHistory();
    }
  } catch {
    say(t().net, true);
  } finally {
    busy = false;
    if (queue.length) drain();
  }
  focusField();
});

function markFresh(state) {
  for (const token of state.tokens) {
    if (token.word && token.revealed) {
      // Finishing reveals everything, not just what was found, and hints don't count as finding.
      token.fresh = !known.has(token.i) && !state.finished && !token.given;
      known.add(token.i);
    }
  }
}

let historyRounds = [];

function paintHistory() {
  const c = t();
  // A page opened and skipped without a guess isn't worth a line.
  const rounds = historyRounds.filter(round => round.count || (game && game.id === round.id));
  $("historyEmpty").textContent = rounds.length ? "" : c.historyEmpty;
  $("history").replaceChildren(...rounds.map(round => {
    const item = document.createElement("li");
    const open = document.createElement("button");
    open.type = "button";
    if (game && game.id === round.id) open.className = "current";
    const status = round.gaveUp ? c.gaveUp : round.finished ? c.solved : "";
    const when = new Date(round.updated * 1000).toLocaleDateString(lang);
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = [c.guesses(round.count), status, round.lang.toUpperCase(), when].filter(Boolean).join(" · ");
    open.append(round.title || c.ongoing, meta);
    open.addEventListener("click", () => resume(round.id));
    item.append(open);
    return item;
  }));
}

async function loadHistory() {
  try {
    const response = await fetch(`api/history/${player}`);
    if (!response.ok) return;
    historyRounds = (await response.json()).rounds;
    paintHistory();
  } catch { /* The list stays as it was. */ }
}

const formatCode = id => id.toUpperCase().replace(/^(.{4})(.{4})$/, "$1-$2");

// Other players' guesses arrive here. Nothing is sent while this tab has a guess on its way.
async function poll() {
  if (!game || game.finished || busy || queue.length || document.hidden) return;
  const id = game.id, before = game.count, version = game.version ?? game.count;
  try {
    const response = await fetch(`api/game/${id}?known=${version}`);
    if (!response.ok) return;
    const state = await response.json();
    if (state.same || !game || game.id !== id || busy || (game.version ?? game.count) !== version) return;
    markCloser(game, state);
    game = state;
    markFresh(game);
    render();
    if (game.count > before) say(t().others(game.count - before));
    if (game.finished) loadHistory();
  } catch { /* Try again on the next round. */ }
}

const gameLink = id => {
  history.replaceState(null, "", `#${id}`);
  store.set("cav-game", id);
};

// A resumed round shows what was already found without marking it all as new.
function adopt(state, resumed) {
  if (!game || game.id !== state.id) showGuessView = false;
  game = state;
  lang = state.lang;
  level = state.level;
  store.set("cav-lang", lang);
  store.set("cav-level", level);
  queue = []; busy = false; confirming = false; countsShown = new Set(); known = new Set();
  marked = new Map(); selected = null; hintConfirm = false;
  paintJump();
  if (resumed) {
    for (const token of state.tokens) if (token.word && token.revealed) known.add(token.i);
  }
  markFresh(game);
  gameLink(game.id);
  paintCopy();
  say("");
  render();
  loadHistory();
  if (!game.finished) focusField();
}

async function resume(id) {
  // Most rounds open at once. Say so when one takes longer, rather than showing nothing.
  const notice = setTimeout(() => say(t().opening), 400);
  try {
    const response = await fetch(`api/game/${encodeURIComponent(id)}?player=${player}`);
    if (response.status === 404) { say(""); return false; }
    const state = await response.json();
    if (state.error) { say(""); return false; }
    adopt(state, true);
    return true;
  } catch {
    say(t().net, true);
    return true; // The round may still exist, so don't replace it because of a network error.
  } finally {
    clearTimeout(notice);
  }
}

async function start() {
  paintCopy();
  $("loading").textContent = t().opening;
  loadHistory();
  const fromLink = location.hash.slice(1);
  const id = fromLink || store.get("cav-game", "");
  if (id && await resume(id)) return;
  await newGame();
  if (fromLink) say(t().gone, true);
}

async function newGame() {
  game = null;
  showGuessView = false;
  queue = []; busy = false; confirming = false; countsShown = new Set(); known = new Set();
  marked = new Map(); selected = null; hintConfirm = false;
  paintJump();
  paintCopy();
  say("");
  $("result").hidden = true;
  $("title").replaceChildren();
  const loading = document.createElement("p");
  loading.className = "loading";
  loading.textContent = t().loading;
  $("text").replaceChildren(loading);
  $("count").textContent = "0";
  $("hintsUsed").textContent = "";
  $("log").replaceChildren();
  $("word").value = "";
  $("word").disabled = $("send").disabled = $("giveup").disabled = true;
  $("next").disabled = true;
  try {
    const state = await post("api/new", { lang, level, player }, t().loading);
    if (state.error) { say(t().noPage, true); $("text").replaceChildren(); return; }
    adopt(state, false);
  } catch {
    say(t().net, true);
  } finally {
    $("next").disabled = false;
  }
}

async function drain() {
  if (busy) return;
  busy = true;
  while (queue.length && game && !game.finished) {
    const word = queue.shift();
    const id = game.id;
    let answer;
    try {
      answer = await post("api/guess", { id, word, player }, t().checking(word));
    } catch {
      say(t().net, true);
      break;
    }
    if (!game || game.id !== id) break;
    const c = t();
    if (answer.error === "duplicate") say(c.dup(answer.word));
    else if (answer.error === "unknown") say(c.unknown(answer.word), true);
    else if (answer.error === "invalid") say(c.invalid, true);
    else if (answer.error === "expired") say(c.expired, true);
    else if (!answer.error) {
      markCloser(game, answer.state);
      game = answer.state;
      markFresh(game);
      const parts = [];
      if (answer.hits) parts.push(c.hit(answer.word, answer.hits));
      if (answer.matches) parts.push(c.near(answer.word, answer.matches, answer.near));
      say(parts.join(" ") || c.nothing(answer.word));
      render();
    }
  }
  busy = false;
  loadHistory();
  if (game && !game.finished) $("word").focus({ preventScroll: true });
}

$("entry").addEventListener("submit", event => {
  event.preventDefault();
  const word = $("word").value.trim();
  if (!word || !game || game.finished) return;
  $("word").value = "";
  if (selected !== null) {
    // A new guess ends the hint selection.
    selected = null;
    hintConfirm = false;
    render();
  }
  queue.push(word);
  drain();
});
$("next").addEventListener("click", newGame);
$("easy").addEventListener("change", () => {
  easy = $("easy").checked;
  store.set("cav-easy", easy ? "1" : "");
  render();
});
$("join").addEventListener("submit", async event => {
  event.preventDefault();
  const code = $("joinCode").value.toLowerCase().replace(/[^0-9a-f]/g, "");
  if (!code) return;
  if (await resume(code)) $("joinCode").value = "";
  else say(t().noCode, true);
});
$("share").addEventListener("click", async () => {
  if (!game) return;
  const link = location.href;
  let copied = false;
  try {
    await navigator.clipboard.writeText(link);
    copied = true;
  } catch {
    // The clipboard API needs HTTPS, so plain HTTP uses the older way.
    const field = document.createElement("textarea");
    field.value = link;
    document.body.append(field);
    field.select();
    try { copied = document.execCommand("copy"); } catch { copied = false; }
    field.remove();
  }
  say(copied ? t().copied : link);
});
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && (!game || game.id !== id)) start();
});
$("lang").addEventListener("change", () => { lang = $("lang").value; store.set("cav-lang", lang); newGame(); });
$("level").addEventListener("change", () => { level = $("level").value; store.set("cav-level", level); newGame(); });
$("giveup").addEventListener("click", async () => {
  if (!game || game.finished) return;
  if (!confirming) { confirming = true; paintCopy(); return; }
  confirming = false;
  paintCopy();
  try {
    const state = await post("api/giveup", { id: game.id });
    if (state.error) { say(t().expired, true); return; }
    markCloser(game, state);
    game = state;
    markFresh(game);
    render();
    loadHistory();
  } catch {
    say(t().net, true);
  }
});
$("playerForm").addEventListener("submit", event => {
  event.preventDefault();
  const code = $("playerInput").value.toLowerCase().replace(/[^0-9a-f]/g, "");
  if (code.length !== 8) { say(t().playerBad, true); return; }
  player = code;
  store.set("cav-player", player);
  $("playerInput").value = "";
  paintCopy();
  loadHistory();
  say(t().playerDone);
});

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitToScreen);
  window.visualViewport.addEventListener("scroll", fitToScreen);
  fitToScreen();
}
window.addEventListener("scroll", fitToScreen, { passive: true });

// Tapping the field normally makes the browser scroll to it. Focus it ourselves instead.
$("word").addEventListener("touchend", event => {
  if (document.activeElement === $("word")) return;
  event.preventDefault();
  $("word").focus({ preventScroll: true });
});

start();
setInterval(poll, 3000);
document.addEventListener("visibilitychange", poll);
</script>
</body>
</html>
