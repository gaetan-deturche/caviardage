<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caviardage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
/* A censor's dossier: cool file-folder paper, inked bars, typed headings. */
:root {
  --desk: #c9d2d6; --paper: #f1f4f3; --ink: #1d2a33; --muted: #566670; --line: #b7c3c8;
  --bar: #141c22; --bar-text: #f1f4f3;
  --same: #1f7a4d; --same-bg: #d5ecdf;
  --focus: #b4540f;
  --missed-bg: #d6dee3; --missed-text: #4a5a64; --stamp: #a32638;
  --type: "Special Elite", "Courier New", monospace;
  --body: "Source Serif 4", Georgia, serif;
  --ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --desk: #11181d; --paper: #1b252c; --ink: #e2e9ea; --muted: #9aaab2; --line: #33434d;
    --bar: #070b0e; --bar-text: #f1f4f3;
    --same: #63c994; --same-bg: #173c2a;
    --focus: #f0a062;
    --missed-bg: #33424c; --missed-text: #c2ccd2; --stamp: #e86a7d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font: 400 18px/1.75 var(--body); padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: 600 16px/1.2 var(--ui); color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
/* With a mouse the page scrolls as usual: the title comes first and the field stays pinned. */
.scroller { display: contents; }
.entrybar { order: 1; }
.top { order: 0; }
.layout { order: 2; }

/* On a touch screen the page never scrolls, because a phone keyboard slides a scrolling page
   out of place. The field is a fixed row, and the rest scrolls underneath, above the keyboard. */
@media (pointer: coarse) {
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { padding: 0; }
  .wrap { display: flex; flex-direction: column; gap: 0; height: var(--visible-height, 100dvh); max-width: none; }
  .entrybar { order: 0; position: static; flex: none; border-width: 0 0 1px; border-radius: 0; padding-top: max(6px, env(safe-area-inset-top, 0px)); }
  .scroller { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; order: 1; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px max(12px, env(safe-area-inset-left, 0px)) 32px max(12px, env(safe-area-inset-right, 0px)); }
  .side { position: static; max-height: none; overflow: visible; }
}
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font: 400 30px/1 var(--type); margin: 0; letter-spacing: .01em; }
.brand s { text-decoration: none; background: var(--ink); color: transparent; border-radius: 2px; padding: 0 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
select, .btn { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 840px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static !important; max-height: none !important; } }

.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 24px clamp(16px, 4vw, 44px) 36px; min-width: 0; }
/* Always on screen: the field and the result of the last guess. */
.entrybar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 3px 3px; padding: 6px clamp(10px, 3vw, 20px) 6px; box-shadow: 0 2px 6px rgb(0 0 0 / 0.18); }
.entry { display: flex; gap: 8px; }
#word { flex: 1; min-width: 0; font: 400 20px/1.2 var(--type); background: transparent; border: 0; border-bottom: 2px solid var(--ink); padding: 6px 4px; }
.msg { min-height: 20px; margin: 3px 0 0; font: 500 14px/1.4 var(--ui); color: var(--muted); }
.msg.bad { color: var(--stamp); }

#title { font: 400 clamp(25px, 4vw, 36px)/1.45 var(--type); margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); text-wrap: balance; }
#text p { margin: 0 0 16px; max-width: 72ch; overflow-wrap: anywhere; }

.slot { display: inline-block; font: inherit; line-height: 1.2; vertical-align: baseline; border-radius: 2px; background: var(--bar); color: var(--bar-text); padding: 0 3px; margin: 0 1px; cursor: pointer; border: 0; text-align: center; }
/* Bars stay black. The closer a guess, the whiter its text. */
.slot.family, .slot.scene { color: color-mix(in srgb, #fff calc(var(--shade) * 100%), #5c6a73); font-style: italic; }
.ramp { margin-top: 8px; padding: 3px 6px; border-radius: 2px; background: var(--bar); font: italic 400 15px/1.2 var(--body); display: flex; justify-content: space-between; }
.ramp span { flex: 1; text-align: center; }
.easy { display: flex; gap: 6px; align-items: center; margin-top: 10px; cursor: pointer; }
.ramp-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 2px; }
.slot.count { font: 600 .8em/1.55 var(--ui); }
.shown.fresh { background: var(--same-bg); color: var(--same); font-weight: 600; border-radius: 2px; box-shadow: 0 0 0 1px var(--same-bg); }
.gaveup .shown { color: var(--ink); }
#text sup, #text sub, #title sup, #title sub { line-height: 0; }
.shown.missed { background: var(--missed-bg); color: var(--missed-text); border-radius: 2px; box-shadow: 0 0 0 1px var(--missed-bg); }

.side { position: sticky; top: 100px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-height: calc(100vh - 116px); overflow: auto; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; font-family: var(--ui); font-size: 15px; line-height: 1.4; }
.card h2 { margin: 0 0 8px; font: 600 13px/1.2 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.code { font: 400 26px/1.2 var(--type); letter-spacing: .04em; overflow-wrap: anywhere; }
.hint { margin: 6px 0 10px; color: var(--muted); }
.team .btn { width: 100%; }
.join { display: flex; gap: 6px; margin-top: 8px; }
.join input { flex: 1; min-width: 0; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 8px; font-family: var(--type); }
.join .btn { width: auto; }
.big { font: 400 40px/1 var(--type); font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.legend li, #log li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 2px; background: var(--line); }
.dot.same { background: var(--same); }
#log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
#log .w { overflow-wrap: anywhere; font-weight: 500; }
#log .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.result { border: 2px solid var(--same); border-radius: 3px; padding: 16px 18px; margin-bottom: 20px; font-family: var(--ui); line-height: 1.45; }
.result.lost { border-color: var(--stamp); }
.result strong { display: block; font: 400 25px/1.25 var(--type); margin-bottom: 4px; }
.result a { color: inherit; }
.credit { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.loading { color: var(--muted); font-family: var(--ui); }
@media (prefers-reduced-motion: no-preference) { .shown.fresh { transition: background .6s; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="entrybar">
    <form id="entry" class="entry" autocomplete="off">
      <input id="word" autocapitalize="off" spellcheck="false" aria-label="Mot">
      <button class="btn primary" id="send" type="submit"></button>
    </form>
    <p id="msg" class="msg" role="status"></p>
  </div>
  <div class="scroller">
  <header class="top">
    <h1 class="brand">Cavi<s>ar</s>dage</h1>
    <div class="controls">
      <label for="lang" hidden>Langue</label>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option></select>
      <label for="level" hidden>Pages</label>
      <select id="level"></select>
      <button id="giveup" class="btn" type="button"></button>
      <button id="next" class="btn primary" type="button"></button>
    </div>
  </header>
  <div class="layout">
    <main class="sheet">
      <div id="result" hidden></div>
      <h2 id="title"></h2>
      <div id="text"><p class="loading" id="loading"></p></div>
    </main>
    <aside class="side">
      <section class="card"><h2 id="countLabel"></h2><div class="big" id="count">0</div></section>
      <section class="card team">
        <h2 id="teamLabel"></h2>
        <div class="code" id="code"></div>
        <p class="hint" id="teamHint"></p>
        <button id="share" class="btn" type="button"></button>
        <form id="join" class="join" autocomplete="off">
          <input id="joinCode" maxlength="14" autocapitalize="characters" spellcheck="false">
          <button class="btn" id="joinSend" type="submit"></button>
        </form>
      </section>
      <section class="card"><h2 id="legendLabel"></h2><ul class="legend" id="legend"></ul>
        <div class="ramp"><span style="color: #6d7a82" id="rampFar"></span><span style="color: #a3acb2">&middot;</span><span style="color: #fff" id="rampClose"></span></div>
        <label class="easy"><input type="checkbox" id="easy"> <span id="easyLabel"></span></label></section>
      <section class="card"><h2 id="logLabel"></h2><ul id="log"></ul></section>
    </aside>
  </div>
  </div>
</div>
<script>
const COPY = {
  fr: {
    easy: "Mode facile : voir le % en cliquant sur une barre", far: "essai loin", close: "essai proche", percent: n => `${n} %`, closeLabel: (n, word) => `« ${word} » est proche à ${n} %`, guessView: "Revoir la page cachée avec mes essais", missedSample: "Surlignés", missedNote: ": les mots que vous n'aviez pas trouvés.", team: "À plusieurs", teamHint: "Partagez ce code : vos amis jouent la même page, et chaque mot trouvé apparaît chez tout le monde.", joinHint: "Code d'un ami", joinSend: "Rejoindre", noCode: "Ce code ne correspond à aucune partie. Vérifiez-le auprès de votre ami.", others: n => `${n} nouvel${n > 1 ? "s" : ""} essai${n > 1 ? "s" : ""} d'un autre joueur.`, share: "Copier le lien", copied: "Lien copié. Ouvrez-le n'importe où pour reprendre cette partie.", gone: "Cette partie est introuvable. Voici une nouvelle page.", famous: "Pages très connues", wide: "Pages connues", deep: "100 000 pages (difficile)", next: "Nouvelle page", giveup: "Abandonner", sure: "Confirmer l'abandon",
    send: "Essayer", placeholder: "Un mot, sous n'importe quelle forme", count: "Essais", legend: "Couleurs", log: "Vos essais",
    same: "Mot trouvé, quelle que soit la forme", none: "Rien de proche",
    loading: "Choix d'une page…", noPage: "Wikipédia n'a pas renvoyé de page. Attendez un instant, puis cliquez sur Nouvelle page.", dup: w => `Déjà essayé : ${w}.`, unknown: w => `« ${w} » n'est pas un mot connu. Cet essai ne compte pas.`,
    invalid: "Entrez un seul mot.", nothing: w => `Rien de proche pour « ${w} ».`, expired: "Cette partie a expiré. Lancez une nouvelle page.", net: "Le serveur ne répond pas. Vérifiez qu'il tourne toujours.",
    hit: (w, n) => `${w} : ${n} mot${n > 1 ? "s" : ""} révélé${n > 1 ? "s" : ""}.`,
    near: (w, n, up) => `${w} : proche de ${n} mot${n > 1 ? "s" : ""} (${up ? `${up} amélioré${up > 1 ? "s" : ""}` : "aucun amélioré"}).`,
    won: n => `Trouvé en ${n} essai${n > 1 ? "s" : ""} !`, lost: n => `Abandon après ${n} essai${n > 1 ? "s" : ""}.`, read: "Lire la page sur Wikipédia", credit: "Texte : Wikipédia, licence CC BY-SA.",
    letters: n => `${n}`, wordLabel: "Mot",
  },
  en: {
    easy: "Easy mode: see the % when clicking a bar", far: "guess far", close: "guess close", percent: n => `${n}%`, closeLabel: (n, word) => `"${word}" is ${n}% close`, guessView: "Show the hidden page with my guesses", missedSample: "Highlighted", missedNote: "words are the ones you hadn't found.", team: "Play together", teamHint: "Share this code: your friends play the same page, and every word found shows up for everyone.", joinHint: "A friend's code", joinSend: "Join", noCode: "That code doesn't match any game. Check it with your friend.", others: n => `${n} new guess${n > 1 ? "es" : ""} from another player.`, share: "Copy link", copied: "Link copied. Open it anywhere to continue this game.", gone: "This game wasn't found. Here's a new page.", famous: "Very famous pages", wide: "Well-known pages", deep: "100,000 pages (hard)", next: "New page", giveup: "Give up", sure: "Confirm giving up",
    send: "Try", placeholder: "One word, in any form", count: "Guesses", legend: "Colours", log: "Your guesses",
    same: "Word found, in any form", none: "Nothing close",
    loading: "Picking a page…", noPage: "Wikipedia didn't return a page. Wait a moment, then click New page.", dup: w => `Already tried: ${w}.`, unknown: w => `"${w}" isn't a known word. This guess doesn't count.`,
    invalid: "Enter a single word.", nothing: w => `Nothing close to "${w}".`, expired: "This game expired. Start a new page.", net: "The server isn't responding. Check that it's still running.",
    hit: (w, n) => `${w}: ${n} word${n > 1 ? "s" : ""} revealed.`,
    near: (w, n, up) => `${w}: close to ${n} word${n > 1 ? "s" : ""} (${up || "none"} improved).`,
    won: n => `Solved in ${n} guess${n > 1 ? "es" : ""}!`, lost: n => `Gave up after ${n} guess${n > 1 ? "es" : ""}.`, read: "Read the page on Wikipedia", credit: "Text: Wikipedia, CC BY-SA licence.",
    letters: n => `${n}`, wordLabel: "Word",
  },
};

const $ = id => document.getElementById(id);
const store = {
  get(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* Settings just won't be remembered. */ } },
};

let game = null, lang = store.get("cav-lang", "fr"), level = store.get("cav-level", "famous");
let easy = store.get("cav-easy", "") === "1";
let showGuessView = false;
let queue = [], busy = false, confirming = false, countsShown = new Set(), known = new Set();
const t = () => COPY[lang];

function paintCopy() {
  const c = t();
  document.documentElement.lang = lang;
  $("lang").value = lang;
  $("level").replaceChildren(...["famous", "wide", "deep"].map(v => new Option(c[v], v)));
  $("level").value = level;
  $("next").textContent = c.next;
  $("share").textContent = c.share;
  $("teamLabel").textContent = c.team;
  $("teamHint").textContent = c.teamHint;
  $("joinCode").placeholder = c.joinHint;
  $("joinSend").textContent = c.joinSend;
  $("giveup").textContent = confirming ? c.sure : c.giveup;
  $("send").textContent = c.send;
  $("word").placeholder = c.placeholder;
  $("word").setAttribute("aria-label", c.wordLabel);
  $("countLabel").textContent = c.count;
  $("legendLabel").textContent = c.legend;
  $("easyLabel").textContent = c.easy;
  $("easy").checked = easy;
  $("rampFar").textContent = c.far;
  $("rampClose").textContent = c.close;
  $("logLabel").textContent = c.log;
  $("legend").replaceChildren(...["same", "none"].map(k => row(k, c[k])));
}

function row(tier, label, extra, shade) {
  const li = document.createElement("li");
  const dot = document.createElement("span");
  dot.className = `dot ${tier}`;
  if (shade) dot.style.background = `color-mix(in srgb, #fff ${shade * 100}%, #5c6a73)`;
  const name = document.createElement("span");
  name.className = "w";
  name.textContent = label;
  li.append(dot, name);
  if (extra !== undefined) {
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = extra;
    li.append(n);
  }
  return li;
}

function say(text, bad) {
  $("msg").textContent = text || "";
  $("msg").classList.toggle("bad", !!bad);
}

async function post(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return response.json();
}

const COUNT_SECONDS = 3;
const countTimers = new Map();

// On a touch screen, focusing the field opens the keyboard over what you just tapped.
function focusField() {
  if (matchMedia("(pointer: fine)").matches) $("word").focus({ preventScroll: true });
}

// The usable height shrinks when a phone keyboard opens. Also undo any slide the browser adds.
function fitToScreen() {
  const view = window.visualViewport;
  if (!view) return;
  document.documentElement.style.setProperty("--visible-height", `${view.height}px`);
  if (matchMedia("(pointer: coarse)").matches && (window.scrollY || view.offsetTop)) window.scrollTo(0, 0);
}

function makeSlot(token) {
  const slot = document.createElement("button");
  slot.type = "button";
  slot.className = "slot" + (token.tier ? ` ${token.tier}` : "");
  slot.style.minWidth = `${Math.max(token.length, 1) * 0.6}em`;
  const shown = countsShown.has(token.i);
  const percent = token.near && easy ? Math.round(token.shade * 100) : null;
  if (token.near) {
    slot.style.setProperty("--shade", token.shade);
    if (percent !== null) slot.title = t().closeLabel(percent, token.near);
  }
  if (shown) slot.classList.add("count");
  slot.textContent = shown
    ? (percent !== null ? `${t().letters(token.length)} · ${t().percent(percent)}` : t().letters(token.length))
    : (token.near || " ");
  slot.addEventListener("click", () => {
    clearTimeout(countTimers.get(token.i));
    if (countsShown.has(token.i)) {
      countsShown.delete(token.i);
    } else {
      countsShown.add(token.i);
      countTimers.set(token.i, setTimeout(() => {
        if (countsShown.delete(token.i)) render();
      }, COUNT_SECONDS * 1000));
    }
    render();
    focusField();
  });
  return slot;
}

function appendTo(parent, token) {
  const target = token.script ? parent.appendChild(document.createElement(token.script)) : parent;
  if (!token.word) { target.append(token.text); return; }
  if (token.revealed) {
    const span = document.createElement("span");
    span.className = "shown" + (token.fresh ? " fresh" : "") + (token.missed ? " missed" : "");
    span.textContent = token.text;
    target.append(span);
    return;
  }
  parent.append(makeSlot(token));
}

function render() {
  if (!game) return;
  const c = t();
  const titleEl = $("title"), textEl = $("text");
  titleEl.replaceChildren();
  textEl.replaceChildren();
  textEl.classList.toggle("gaveup", game.gaveUp);
  let paragraph = document.createElement("p");
  const tokens = game.finished && showGuessView ? game.guessView : game.tokens;
  for (const token of tokens) {
    if (token.part === "break") {
      if (paragraph.childNodes.length) textEl.append(paragraph);
      paragraph = document.createElement("p");
    } else if (token.part === "title") {
      appendTo(titleEl, token);
    } else {
      appendTo(paragraph, token);
    }
  }
  if (paragraph.childNodes.length) textEl.append(paragraph);

  $("count").textContent = game.count;
  $("code").textContent = formatCode(game.id);
  $("log").replaceChildren(...[...game.log].reverse().map(g => row(g.hits ? "same" : "none", g.word, g.hits || "", g.hits ? 0 : g.shade)));
  $("word").disabled = $("send").disabled = $("giveup").disabled = game.finished;

  const result = $("result");
  result.hidden = !game.finished;
  if (game.finished) {
    result.className = "result" + (game.gaveUp ? " lost" : "");
    const head = document.createElement("strong");
    head.textContent = game.gaveUp ? c.lost(game.count) : c.won(game.count);
    const name = document.createElement("div");
    name.textContent = game.answer.title;
    const link = document.createElement("a");
    link.href = game.answer.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = c.read;
    const legend = document.createElement("p");
    legend.className = "credit";
    const sample = document.createElement("span");
    sample.className = "shown missed";
    sample.textContent = c.missedSample;
    legend.append(sample, ` ${c.missedNote}`);
    const credit = document.createElement("p");
    credit.className = "credit";
    credit.textContent = c.credit;
    const view = document.createElement("label");
    view.className = "easy";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = "guessView";
    box.checked = showGuessView;
    box.addEventListener("change", () => {
      showGuessView = box.checked;
      render();
    });
    const viewText = document.createElement("span");
    viewText.textContent = c.guessView;
    view.append(box, viewText);
    legend.hidden = showGuessView;
    result.replaceChildren(head, name, link, view, legend, credit);
  }
}

function markFresh(state) {
  for (const token of state.tokens) {
    if (token.word && token.revealed) {
      token.fresh = !known.has(token.i) && !state.finished; // Finishing reveals everything, not just what was found.
      known.add(token.i);
    }
  }
}

const formatCode = id => id.toUpperCase().replace(/^(.{4})(.{4})$/, "$1-$2");

// Other players' guesses arrive here. Nothing is sent while this tab has a guess on its way.
async function poll() {
  if (!game || game.finished || busy || queue.length || document.hidden) return;
  const id = game.id, before = game.count;
  try {
    const response = await fetch(`api/game/${id}?known=${before}`);
    if (!response.ok) return;
    const state = await response.json();
    if (state.same || !game || game.id !== id || busy || game.count !== before) return;
    game = state;
    markFresh(game);
    render();
    if (game.count > before) say(t().others(game.count - before));
  } catch { /* Try again on the next round. */ }
}

const gameLink = id => {
  history.replaceState(null, "", `#${id}`);
  store.set("cav-game", id);
};

// A resumed round shows what was already found without marking it all as new.
function adopt(state, resumed) {
  if (!game || game.id !== state.id) showGuessView = false;
  game = state;
  lang = state.lang;
  level = state.level;
  store.set("cav-lang", lang);
  store.set("cav-level", level);
  queue = []; busy = false; confirming = false; countsShown = new Set(); known = new Set();
  if (resumed) {
    for (const token of state.tokens) if (token.word && token.revealed) known.add(token.i);
  }
  markFresh(game);
  gameLink(game.id);
  paintCopy();
  say("");
  render();
  if (!game.finished) focusField();
}

async function resume(id) {
  try {
    const response = await fetch(`api/game/${encodeURIComponent(id)}`);
    if (response.status === 404) return false;
    const state = await response.json();
    if (state.error) return false;
    adopt(state, true);
    return true;
  } catch {
    say(t().net, true);
    return true; // The round may still exist, so don't replace it because of a network error.
  }
}

async function start() {
  paintCopy();
  const fromLink = location.hash.slice(1);
  const id = fromLink || store.get("cav-game", "");
  if (id && await resume(id)) return;
  await newGame();
  if (fromLink) say(t().gone, true);
}

async function newGame() {
  game = null;
  showGuessView = false;
  queue = []; busy = false; confirming = false; countsShown = new Set(); known = new Set();
  paintCopy();
  say("");
  $("result").hidden = true;
  $("title").replaceChildren();
  const loading = document.createElement("p");
  loading.className = "loading";
  loading.textContent = t().loading;
  $("text").replaceChildren(loading);
  $("count").textContent = "0";
  $("log").replaceChildren();
  $("word").value = "";
  $("word").disabled = $("send").disabled = $("giveup").disabled = true;
  $("next").disabled = true;
  try {
    const state = await post("api/new", { lang, level });
    if (state.error) { say(t().noPage, true); $("text").replaceChildren(); return; }
    adopt(state, false);
  } catch {
    say(t().net, true);
  } finally {
    $("next").disabled = false;
  }
}

async function drain() {
  if (busy) return;
  busy = true;
  while (queue.length && game && !game.finished) {
    const word = queue.shift();
    const id = game.id;
    let answer;
    try {
      answer = await post("api/guess", { id, word });
    } catch {
      say(t().net, true);
      break;
    }
    if (!game || game.id !== id) break;
    const c = t();
    if (answer.error === "duplicate") say(c.dup(answer.word));
    else if (answer.error === "unknown") say(c.unknown(answer.word), true);
    else if (answer.error === "invalid") say(c.invalid, true);
    else if (answer.error === "expired") say(c.expired, true);
    else if (!answer.error) {
      game = answer.state;
      markFresh(game);
      const parts = [];
      if (answer.hits) parts.push(c.hit(answer.word, answer.hits));
      if (answer.matches) parts.push(c.near(answer.word, answer.matches, answer.near));
      say(parts.join(" ") || c.nothing(answer.word));
      render();
    }
  }
  busy = false;
  if (game && !game.finished) $("word").focus({ preventScroll: true });
}

$("entry").addEventListener("submit", event => {
  event.preventDefault();
  const word = $("word").value.trim();
  if (!word || !game || game.finished) return;
  $("word").value = "";
  queue.push(word);
  drain();
});
$("next").addEventListener("click", newGame);
$("easy").addEventListener("change", () => {
  easy = $("easy").checked;
  store.set("cav-easy", easy ? "1" : "");
  render();
});
$("join").addEventListener("submit", async event => {
  event.preventDefault();
  const code = $("joinCode").value.toLowerCase().replace(/[^0-9a-f]/g, "");
  if (!code) return;
  if (await resume(code)) $("joinCode").value = "";
  else say(t().noCode, true);
});
$("share").addEventListener("click", async () => {
  if (!game) return;
  const link = location.href;
  let copied = false;
  try {
    await navigator.clipboard.writeText(link);
    copied = true;
  } catch {
    // The clipboard API needs HTTPS, so plain HTTP uses the older way.
    const field = document.createElement("textarea");
    field.value = link;
    document.body.append(field);
    field.select();
    try { copied = document.execCommand("copy"); } catch { copied = false; }
    field.remove();
  }
  say(copied ? t().copied : link);
});
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && (!game || game.id !== id)) start();
});
$("lang").addEventListener("change", () => { lang = $("lang").value; store.set("cav-lang", lang); newGame(); });
$("level").addEventListener("change", () => { level = $("level").value; store.set("cav-level", level); newGame(); });
$("giveup").addEventListener("click", async () => {
  if (!game || game.finished) return;
  if (!confirming) { confirming = true; paintCopy(); return; }
  confirming = false;
  paintCopy();
  try {
    const state = await post("api/giveup", { id: game.id });
    if (state.error) { say(t().expired, true); return; }
    game = state;
    markFresh(game);
    render();
  } catch {
    say(t().net, true);
  }
});

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitToScreen);
  window.visualViewport.addEventListener("scroll", fitToScreen);
  fitToScreen();
}
window.addEventListener("scroll", fitToScreen, { passive: true });

// Tapping the field normally makes the browser scroll to it. Focus it ourselves instead.
$("word").addEventListener("touchend", event => {
  if (document.activeElement === $("word")) return;
  event.preventDefault();
  $("word").focus({ preventScroll: true });
});

start();
setInterval(poll, 3000);
document.addEventListener("visibilitychange", poll);
</script>
</body>
</html>
