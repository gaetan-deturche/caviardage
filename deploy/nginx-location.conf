# Inside the server block:
location = /caviardage { return 301 /caviardage/; }
location /caviardage/ {
    limit_req zone=caviardage burst=30 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:5180/;
    proxy_read_timeout 20s;
}
# In the http block (for example /etc/nginx/conf.d/caviardage.conf):
# limit_req_zone $binary_remote_addr zone=caviardage:1m rate=5r/s;
